<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TACT 授業資料</title><link rel="stylesheet" href="css/material-download.css"></head><body><main><p class="eyebrow">TACT EXTENSION</p><h1>授業資料をまとめて取得</h1><p>先生のフォルダ構造を保って保存します。2回目からは新規・更新分だけを取得します。</p><label for="course">科目</label><select id="course"></select><p id="destination"></p><div class="actions"><button id="choose">保存先を選ぶ・変更</button><button id="grant" hidden>このフォルダを再許可</button><button id="download" disabled>資料を取得</button></div><p id="status" role="status" aria-live="polite">読み込み中…</p><ul id="details"></ul><details><summary>ChatGPTに入力するプロンプト</summary><label for="prompt">解説用プロンプト（変更すると保存）</label><textarea id="prompt" rows="5"></textarea></details><h2>資料一覧</h2><ul id="resources"></ul><aside>初回だけ保存先の「授業資料」フォルダを選んでください。OneDrive内ならOneDriveが自動で同期します。権限が有効な間は、次回から「資料を取得」だけで保存できます。権限が切れたら再許可または保存先の選び直しができます。保存した資料は自動削除しません。外部サイトのリンクは取得対象外です。</aside></main><script src="materials.js"></script></body></html>
